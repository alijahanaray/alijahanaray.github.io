<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Nevada Forward Data Repository · Sign in</title>
<style>
  :root {
    --scarlet: #cf0a2c;
    --scarlet-dark: #a50822;
    --gray: #636466;
    --light: #f4f4f5;
    --border: #dcdcde;
    --text: #1d1d1f;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--light); line-height: 1.5; }
  header { background: var(--scarlet); color: #fff; border-bottom: 6px solid #000; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  header .wrap { padding-top: 28px; padding-bottom: 28px; }
  header p.kicker { margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  header h1 { margin: 4px 0 6px; font-size: 32px; }
  header p.sub { margin: 0; opacity: .95; }
  .notice { background: #fff8e1; border-left: 5px solid #e0a800; margin: 20px 0; padding: 12px 16px; font-size: 14px; border-radius: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 14px; }
  .controls input, .controls select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; background: #fff; }
  .controls input { flex: 1 1 260px; }
  .count { color: var(--gray); font-size: 14px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; padding-bottom: 40px; }
  .card { background: var(--bg); border: 1px solid var(--border); border-top: 4px solid var(--scarlet); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0 0 12px; color: #3a3a3c; font-size: 14px; }
  .meta { font-size: 13px; color: var(--gray); margin-bottom: 12px; }
  .meta div { margin: 2px 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--light); border: 1px solid var(--border); }
  .tag.restricted { background: #fde8ec; border-color: #f3b3bf; color: var(--scarlet-dark); }
  .card a.btn { margin-top: auto; text-align: center; background: var(--scarlet); color: #fff; text-decoration: none; padding: 9px 12px; border-radius: 6px; font-weight: 600; font-size: 14px; }
  .card a.btn:hover { background: var(--scarlet-dark); }
  .empty { padding: 30px; text-align: center; color: var(--gray); }
  /* ---- Year 2 summary ---- */
  .section-title { font-size: 22px; margin: 28px 0 4px; } .section-sub { color: var(--gray); font-size: 14px; margin: 0 0 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi { background: #fff; border: 1px solid var(--border); border-top: 4px solid var(--scarlet); border-radius: 8px; padding: 14px; }
  .kpi .n { font-size: 30px; font-weight: 700; color: var(--scarlet); line-height: 1.1; } .kpi .l { font-size: 13px; color: var(--gray); margin-top: 4px; }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 17px; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 52px; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .bar { background: var(--light); border-radius: 4px; height: 14px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--scarlet); }
  .bar.gray i { background: var(--gray); } .bar-row span:last-child { text-align: right; font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--border); background: #fff; padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--scarlet); color: #fff; border-color: var(--scarlet); }
  .tbl-wrap { overflow-x: auto; } table.sc { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.sc th, table.sc td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.sc th { background: var(--light); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); }
  .st { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .st.Exceeded { background: #e3f4e8; color: #1b6e35; } .st.Met { background: #e6f0fb; color: #1d5aa6; }
  .st.Not-met { background: #fde8ec; color: var(--scarlet-dark); } .st.In-progress, .st.Pending { background: #fff4d6; color: #8a6300; }
  .gaps li { margin: 4px 0; font-size: 14px; } .src { font-size: 12px; color: var(--gray); margin-top: 8px; }
  footer { background: #1d1d1f; color: #bbb; font-size: 13px; padding: 20px 0; }
  footer a { color: #fff; }

  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--light); padding: 20px; }
  #login form { background: #fff; width: 100%; max-width: 380px; border-top: 6px solid var(--scarlet); border-radius: 8px; padding: 28px; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
  #login h1 { font-size: 22px; margin: 0 0 4px; } #login p { margin: 0 0 18px; color: var(--gray); font-size: 14px; }
  #login label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  #login input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; }
  #login button { width: 100%; margin-top: 18px; padding: 11px; background: var(--scarlet); color: #fff; border: 0; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #login button:hover { background: var(--scarlet-dark); } #err { color: var(--scarlet-dark); font-size: 14px; min-height: 20px; margin-top: 10px; }
</style></head>
<body>
<div id="login"><form id="f" autocomplete="on">
  <h1>Nevada Forward Data Repository</h1><p>Team members only. Sign in to continue.</p>
  <label for="u">Username</label><input id="u" autocomplete="username" required autofocus>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button><div id="err" role="alert"></div>
</form></div>

const d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  try {
    const u = document.getElementById("u").value.trim().toLowerCase(), p = document.getElementById("p").value;
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(u + ":" + p), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: d(SALT), iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: d(IV) }, key, d(DATA));
    document.body.innerHTML = new TextDecoder().decode(plain);
    document.body.querySelectorAll("script").forEach(o => { const n = document.createElement("script"); n.textContent = o.textContent; o.replaceWith(n); });
  } catch (x) { err.textContent = "Incorrect username or password."; }
});
